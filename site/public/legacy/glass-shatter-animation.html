  html{
    overflow-x:hidden;
  }

  body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
  }

  /* ---------- grain ---------- */
  .grain{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
    opacity:0.05;

  /* ---------- mode bar ---------- */
  .mode-bar{
    position:fixed;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    display:flex;
    gap:6px;
    padding:6px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .mode-btn{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    background:transparent;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:color .35s ease, background .35s ease;
  }
  .mode-btn:hover{ color:#fff; }
  .mode-btn.active{ color:#191308; background:var(--accent); }
  .mode-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- stage ---------- */
  .stage{
    position:sticky;
    top:0;
    height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.4rem;
    z-index:1;
  }

  .mosaic-wrap{
    position:relative;
    width:clamp(280px, 76vw, 880px);
    aspect-ratio:2560 / 1738;
    filter:drop-shadow(0 40px 70px rgba(0,0,0,0.55));
  }

  .shards{
    position:absolute;
    inset:0;
  }

  .shard{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    will-change:transform, opacity, filter;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }

  .vignette{
    position:absolute;
    inset:-16%;
    z-index:5;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(10,10,15,0.55) 70%, var(--bg) 100%);
  }

  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(20px, 3vw, 34px);
    color:var(--ink);
    letter-spacing:0.03em;
    text-align:center;
    margin:0;
    opacity:0;
    text-shadow:0 2px 28px rgba(224,164,88,0.35);
    pointer-events:none;
    z-index:6;
  }

  .hint{
    position:fixed;
    bottom:28px;
    left:0;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.35);
    z-index:60;
    pointer-events:none;
    text-align:center;
    width:100%;
    padding-inline:16px;
    transition:opacity .4s ease;
  }

  #scrollSpacer{ height:0; }
  body[data-mode="scroll"] #scrollSpacer{ height:170svh; }
  body[data-mode="click"] .mosaic-wrap{ cursor:pointer; }

  body.reduced-motion .mode-bar,
  body.reduced-motion .hint,
  body.reduced-motion .tagline{ display:none; }

  @media (max-width:640px){
    .mode-bar{ top:16px; }
    .mode-btn{ padding:8px 14px; font-size:11px; }
    .hint{ bottom:16px; }
  }
</style>

    return "polygon(" + pts.join(",") + ")";
  }
  function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }
  function easeInOutCubic(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; }

  /* ============ build shard elements ============ */
  const container = document.getElementById("shards");
  const wrap = document.getElementById("mosaicWrap");
  const tagline = document.getElementById("tagline");
  const hintEl = document.getElementById("hint");

  const prepared = SHARD_DATA.map((d, i) => {
    const [cx, cy, r, g, b, poly] = d;
    const dx = cx - MOSAIC_CENTER[0];
    const dy = cy - MOSAIC_CENTER[1];
    return { i, cx, cy, r, g, b, poly, dx, dy, dist: Math.hypot(dx, dy) };
  });
  const maxDist = Math.max.apply(null, prepared.map(p => p.dist));

  const shards = prepared.map(p => {
    const distFactor = p.dist / maxDist;
    const jitter = 0.85 + seededRandom(p.i) * 0.3;
    const hSign = Math.abs(p.dx) > 0.4 ? Math.sign(p.dx) : (p.i % 2 === 0 ? 1 : -1);

    const scatterXMag = lerp(50, 210, distFactor) * jitter;
    const scatterX = hSign * scatterXMag;

    const vJitter = (seededRandom(p.i + 50) - 0.5) * 10;
    const scatterY = clamp(p.dy * 0.55 + vJitter, -30, 30);

    const rotJitter = 0.7 + seededRandom(p.i + 100) * 0.6;
    const rotSign = hSign * (seededRandom(p.i + 200) > 0.22 ? 1 : -1);
    const rotation = rotSign * lerp(6, 15, distFactor) * rotJitter;

    const opacityTarget = lerp(0.92, 0.72, distFactor);
    const glowSize = lerp(8, 34, distFactor);
    const glowAlpha = lerp(0.22, 0.5, distFactor);

    const el = document.createElement("img");
    el.src = IMAGE_SRC;
    el.alt = "";
    el.setAttribute("aria-hidden", "true");
    el.className = "shard";
    el.style.clipPath = polyToClip(p.poly);
    el.style.webkitClipPath = polyToClip(p.poly);
    container.appendChild(el);

    return Object.assign({}, p, {
      el, scatterX, scatterY, rotation, opacityTarget, glowSize, glowAlpha, distFactor
    });
  });

  /* ============ responsive scaling ============ */
  function responsiveFactor(){
    const w = window.innerWidth;
    if (w < 480) return 0.38;
    if (w < 720) return 0.55;
    if (w < 1080) return 0.8;
    return 1;
  }

  /* ============ core render ============ */
  let currentBounce = 0;

  function applyT(t){
    const rf = responsiveFactor();
    for (const s of shards){
      const tx = s.scatterX * t * rf;
      const ty = s.scatterY * t * rf;
      const rot = s.rotation * t;
      const scale = 1 + currentBounce;
      s.el.style.transform =
        "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) " +
        "rotate(" + rot.toFixed(2) + "deg) scale(" + scale.toFixed(4) + ")";

      const op = 1 + (s.opacityTarget - 1) * t;
      s.el.style.opacity = op.toFixed(3);

      const glowA = s.glowAlpha * t;
      if (glowA > 0.015){
        const glowS = (s.glowSize * t).toFixed(1);
        s.el.style.filter = "drop-shadow(0 0 " + glowS + "px rgba(" + s.r + "," + s.g + "," + s.b + "," + glowA.toFixed(3) + "))";
      } else {
        s.el.style.filter = "none";
      }
    }
    const taglineOp = clamp((t - 0.28) / 0.35, 0, 1);
    tagline.style.opacity = taglineOp.toFixed(3);
  }

  /* ============ reduced motion ============ */
  const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (REDUCED_MOTION){
    document.body.classList.add("reduced-motion");
    applyT(0);
    return;
  }

  /* ============ animation engine ============ */
  let rafId = null;
  let currentT = 0;
  let currentMode = null;
  let breatheStart = null;
  let assembled = true;

  function cancelLoop(){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  function animateTo(target, duration, easingFn, onDone){
    cancelLoop();
    const start = currentT;
    const t0 = performance.now();
    function frame(now){
      const p = Math.min(1, (now - t0) / duration);
      currentT = start + (target - start) * easingFn(p);
      applyT(currentT);
      if (p < 1){
        rafId = requestAnimationFrame(frame);
      } else {
        rafId = null;
        if (onDone) onDone();
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function bounceSettle(){
    cancelLoop();
    const dur = 380;
    const t0 = performance.now();
    function frame(now){
      const p = Math.min(1, (now - t0) / dur);
      currentBounce = Math.sin(p * Math.PI) * 0.022;
      applyT(currentT);
      if (p < 1){
        rafId = requestAnimationFrame(frame);
      } else {
        currentBounce = 0;
        applyT(currentT);
        rafId = null;
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ---- scroll mode ---- */
  function computeScrollTarget(){
    const range = window.innerHeight * 1.15;
    return clamp(window.scrollY / range, 0, 1);
  }
  function scrollLoop(){
    if (currentMode !== "scroll") return;
    const target = computeScrollTarget();
    currentT += (target - currentT) * 0.14;
    if (Math.abs(target - currentT) < 0.0008) currentT = target;
    applyT(currentT);
    rafId = requestAnimationFrame(scrollLoop);
  }

  /* ---- breathe mode ---- */
  function breatheLoop(timestamp){
    if (currentMode !== "breathe") return;
    if (breatheStart === null) breatheStart = timestamp;
    const elapsed = (timestamp - breatheStart) / 1000;
    const amplitude = 0.22;
    const speed = (2 * Math.PI) / 5.5;
    currentT = amplitude * (0.5 - 0.5 * Math.cos(elapsed * speed));
    applyT(currentT);
    rafId = requestAnimationFrame(breatheLoop);
  }

  /* ---- click mode ---- */
  function toggleClick(){
    if (currentMode !== "click") return;
    assembled = !assembled;
    if (assembled){
      animateTo(0, 700, easeInOutCubic, bounceSettle);
    } else {
      animateTo(1, 820, easeOutCubic);
    }
  }

  const HINTS = {
    scroll: "Scroll to shatter — scroll back up to reform",
    click: "Click anywhere on the glass",
    breathe: "Watching quietly"
  };

  function setMode(mode){
    if (mode === currentMode) return;
    currentMode = mode;
    cancelLoop();
    currentBounce = 0;

    document.querySelectorAll(".mode-btn").forEach(b => {
      const active = b.dataset.mode === mode;
      b.classList.toggle("active", active);
      b.setAttribute("aria-pressed", active ? "true" : "false");
    });
    document.body.dataset.mode = mode;
    hintEl.textContent = HINTS[mode] || "";

    if (mode === "scroll"){
      window.scrollTo(0, 0);
      currentT = 0;
      applyT(0);
      rafId = requestAnimationFrame(scrollLoop);
    } else if (mode === "click"){
      assembled = true;
      animateTo(0, 500, easeInOutCubic);
    } else if (mode === "breathe"){
      breatheStart = null;
      rafId = requestAnimationFrame(breatheLoop);
    }
  }

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  wrap.addEventListener("click", toggleClick);
  wrap.setAttribute("tabindex", "0");
  wrap.setAttribute("role", "button");
  wrap.setAttribute("aria-label", "Toggle glass shatter");
  wrap.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && currentMode === "click"){
      e.preventDefault();
      toggleClick();
    }
  });

  window.addEventListener("resize", () => applyT(currentT));

  setMode("scroll");
})();
</script>
</body>
</html>
