<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Femme Ferments — Beauty in the Broken Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1118;
    --accent:#d9a55a;
    --ink:#f3ead9;
    --dx-mult:18;
    --dy-mult:4;
  }

  *{ box-sizing:border-box; }

  html{
    overflow-x:hidden;
    background:var(--bg);
  }

  body{
    margin:0;
    padding:0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, #171b28 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, #14161f 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  /* ---------- grain ---------- */
  .grain{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
    opacity:0.045;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }

  /* ---------- decorative background glass ---------- */
  .bg-decor{
    position:fixed;
    z-index:0;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    object-fit:contain;
    filter:blur(0.3px);
  }
  .bg-decor--tl{
    top:-6%;
    left:-8%;
    width:clamp(220px, 30vw, 420px);
    opacity:0.16;
    transform:rotate(-8deg);
  }
  .bg-decor--br{
    bottom:-8%;
    right:-8%;
    width:clamp(240px, 32vw, 460px);
    opacity:0.18;
    transform:rotate(10deg);
  }

  /* ---------- mode bar ---------- */
  .mode-bar{
    position:fixed;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    display:flex;
    gap:6px;
    padding:6px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .mode-btn{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    background:transparent;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:color .35s ease, background .35s ease;
  }
  .mode-btn:hover{ color:#fff; }
  .mode-btn.active{ color:#20160a; background:var(--accent); }
  .mode-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- brand header ---------- */
  .brand-header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:16vh 24px 4vh;
  }
  .brand-name{
    margin:0;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:clamp(26px, 3.6vw, 42px);
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:var(--ink);
    text-indent:0.42em; /* balance trailing letter-spacing */
  }

  /* ---------- stage ---------- */
  .stage{
    position:sticky;
    top:0;
    height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.2rem;
    z-index:1;
    padding:0 20px;
  }

  .glass-wrap{
    position:relative;
    width:min(900px, 88vw);
    filter:drop-shadow(0 40px 70px rgba(0,0,0,0.55));
  }

  .glass-stage{
    position:relative;
    width:100%;
    aspect-ratio:1275 / 945;
    overflow:visible;
  }

  .glass-piece{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    will-change:transform, opacity;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }

  body[data-mode="click"] .glass-piece{
    transition:transform 800ms cubic-bezier(.16,1,.3,1), opacity 800ms cubic-bezier(.16,1,.3,1);
  }
  body[data-mode="click"] .glass-wrap{ cursor:pointer; }

  @keyframes wrapBounce{
    0%{ transform:scale(1.02); }
    100%{ transform:scale(1); }
  }
  .glass-wrap.bounce{
    animation:wrapBounce 380ms cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes breathePiece{
    0%, 100%{ transform:translate3d(0,0,0) rotate(0deg); opacity:1; }
    50%{ transform:translate3d(calc(var(--dx) * 2.6), calc(var(--dy) * 2.6), 0) rotate(calc(var(--rot, 0) * 0.15 * 1deg)); opacity:0.95; }
  }
  body[data-mode="breathe"] .glass-piece{
    animation:breathePiece 6.2s ease-in-out infinite;
  }

  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(20px, 3vw, 34px);
    color:var(--ink);
    letter-spacing:0.03em;
    text-align:center;
    margin:0;
    opacity:0;
    text-shadow:0 2px 28px rgba(217,165,90,0.35);
    pointer-events:none;
    z-index:6;
  }

  .hint{
    position:fixed;
    bottom:28px;
    left:0;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.35);
    z-index:60;
    pointer-events:none;
    text-align:center;
    width:100%;
    padding-inline:16px;
  }

  #scrollSpacer{ height:0; }
  body[data-mode="scroll"] #scrollSpacer{ height:300vh; }

  body.reduced-motion .mode-bar,
  body.reduced-motion .hint,
  body.reduced-motion .tagline{ display:none; }
  body.reduced-motion #scrollSpacer{ height:0 !important; }

  @media (max-width:640px){
    :root{ --dx-mult:9; --dy-mult:2.6; }
    .mode-bar{ top:16px; }
    .mode-btn{ padding:8px 14px; font-size:11px; }
    .hint{ bottom:16px; }
    .brand-header{ padding-top:10vh; }
    .bg-decor--tl{ width:clamp(160px, 40vw, 260px); }
    .bg-decor--br{ width:clamp(170px, 42vw, 280px); }
  }

  @media (prefers-reduced-motion: reduce){
    .glass-piece{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

  <div class="grain"></div>

  <img class="bg-decor bg-decor--tl" src="/glass-assets/tight_png/02_left_top_teal_shards_tight.png" alt="" aria-hidden="true" />
  <img class="bg-decor bg-decor--br" src="/glass-assets/tight_png/17_lower_right_purple_tail_tight.png" alt="" aria-hidden="true" />

  <nav class="mode-bar" role="group" aria-label="Animation mode">
    <button class="mode-btn" data-mode="scroll" aria-pressed="false">Scroll</button>
    <button class="mode-btn" data-mode="click" aria-pressed="false">Click</button>
    <button class="mode-btn" data-mode="breathe" aria-pressed="false">Breathe</button>
  </nav>

  <header class="brand-header">
    <h1 class="brand-name">Femme Ferments</h1>
  </header>

  <main class="stage">
    <div class="glass-wrap" id="glassWrap">
      <div class="glass-stage" id="glassStage">
        <img class="glass-piece" src="/glass-assets/canvas_png/01_left_outer_teal_points_canvas.png" alt="" style="--cx:18.545%;--cy:37.232%;--dx:-16.7px;--dy:-4.5px;--delay:0ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/02_left_top_teal_shards_canvas.png" alt="" style="--cx:26.456%;--cy:25.369%;--dx:-12.5px;--dy:-9.2px;--delay:45ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/03_left_mid_blue_green_canvas.png" alt="" style="--cx:26.644%;--cy:44.833%;--dx:-12.4px;--dy:-1.5px;--delay:90ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/04_left_lower_green_blue_canvas.png" alt="" style="--cx:26.23%;--cy:59.508%;--dx:-12.6px;--dy:4.3px;--delay:135ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/05_lower_left_blue_tail_canvas.png" alt="" style="--cx:27.552%;--cy:75.012%;--dx:-11.9px;--dy:10.4px;--delay:180ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/06_upper_mid_green_crown_canvas.png" alt="" style="--cx:38.699%;--cy:33.346%;--dx:-6.0px;--dy:-6.0px;--delay:225ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/07_mid_left_green_bridge_canvas.png" alt="" style="--cx:38.325%;--cy:49.679%;--dx:-6.2px;--dy:0.4px;--delay:270ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/08_center_core_burst_canvas.png" alt="" style="--cx:47.244%;--cy:36.71%;--dx:-1.5px;--dy:-4.7px;--delay:315ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/09_lower_center_cyan_blue_canvas.png" alt="" style="--cx:47.755%;--cy:69.997%;--dx:-1.2px;--dy:8.4px;--delay:360ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/10_upper_yellow_orange_canvas.png" alt="" style="--cx:58.5%;--cy:26.59%;--dx:4.5px;--dy:-8.7px;--delay:405ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/11_right_upper_pink_orange_canvas.png" alt="" style="--cx:68.857%;--cy:31.703%;--dx:10.0px;--dy:-6.7px;--delay:450ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/12_upper_right_purple_sail_canvas.png" alt="" style="--cx:78.844%;--cy:24.755%;--dx:15.3px;--dy:-9.4px;--delay:495ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/13_right_mid_teal_glass_canvas.png" alt="" style="--cx:67.298%;--cy:44.714%;--dx:9.2px;--dy:-1.6px;--delay:540ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/14_right_warm_red_orange_canvas.png" alt="" style="--cx:82.459%;--cy:43.023%;--dx:17.2px;--dy:-2.2px;--delay:585ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/15_right_lower_blue_purple_canvas.png" alt="" style="--cx:65.48%;--cy:61.401%;--dx:8.2px;--dy:5.0px;--delay:630ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/16_far_right_red_tail_canvas.png" alt="" style="--cx:87.686%;--cy:56.728%;--dx:20.0px;--dy:3.2px;--delay:675ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/17_lower_right_purple_tail_canvas.png" alt="" style="--cx:82.008%;--cy:70.233%;--dx:17.0px;--dy:8.5px;--delay:720ms;" />
        <img class="glass-piece" src="/glass-assets/canvas_png/18_bottom_center_teal_splinters_canvas.png" alt="" style="--cx:58.986%;--cy:75.417%;--dx:4.8px;--dy:10.5px;--delay:765ms;" />
      </div>
    </div>
    <p class="tagline" id="tagline">Beauty in the Broken Glass</p>
  </main>

  <p class="hint" id="hint"></p>

  <div id="scrollSpacer"></div>

<script>
(function(){
  "use strict";

  const stageEl = document.getElementById('glassStage');
  const wrapEl = document.getElementById('glassWrap');
  const tagline = document.getElementById('tagline');
  const hintEl = document.getElementById('hint');
  const pieces = Array.prototype.slice.call(stageEl.querySelectorAll('.glass-piece'));

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const MAX_DELAY = 765;

  const items = pieces.map((el, i) => {
    const dx = parseFloat(el.style.getPropertyValue('--dx')) || 0;
    const dy = parseFloat(el.style.getPropertyValue('--dy')) || 0;
    const delay = parseFloat(el.style.getPropertyValue('--delay')) || 0;
    const rotMag = (i + 1) * 2;
    const rot = (i % 2 === 0) ? rotMag : -rotMag;
    el.style.setProperty('--rot', rot);
    return { el, dx, dy, delay, rot };
  });

  function readMultipliers(){
    const cs = getComputedStyle(document.documentElement);
    return {
      dxMult: parseFloat(cs.getPropertyValue('--dx-mult')) || 18,
      dyMult: parseFloat(cs.getPropertyValue('--dy-mult')) || 4
    };
  }
  let mult = readMultipliers();

  function transformFor(item, t){
    const tx = item.dx * mult.dxMult * t;
    const ty = item.dy * mult.dyMult * t;
    const rot = item.rot * t;
    return { tx, ty, rot };
  }

  function applyUniform(t){
    for (const item of items){
      const { tx, ty, rot } = transformFor(item, t);
      item.el.style.transform = 'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
      item.el.style.opacity = (1 - t * 0.3).toFixed(3);
    }
    tagline.style.opacity = clamp((t - 0.35) / 0.4, 0, 1).toFixed(3);
  }

  const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (REDUCED_MOTION){
    document.body.classList.add('reduced-motion');
    applyUniform(0);
    return;
  }

  let rafId = null;
  let currentT = 0;
  let currentMode = null;
  let assembled = true;
  let bounceTimer = null;

  function cancelLoop(){ if (rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  /* ---- scroll mode ---- */
  function computeScrollTarget(){
    const range = window.innerHeight * 2.2;
    return clamp(window.scrollY / range, 0, 1);
  }
  function scrollLoop(){
    if (currentMode !== 'scroll') return;
    const target = computeScrollTarget();
    currentT += (target - currentT) * 0.14;
    if (Math.abs(target - currentT) < 0.0008) currentT = target;
    applyUniform(currentT);
    rafId = requestAnimationFrame(scrollLoop);
  }

  /* ---- click mode (CSS-transition driven) ---- */
  function setClickState(toShattered){
    assembled = !toShattered;
    const t = toShattered ? 1 : 0;
    let maxTotal = 0;
    for (const item of items){
      const delayMs = toShattered ? item.delay : (MAX_DELAY - item.delay) * 0.35;
      item.el.style.transitionDelay = delayMs.toFixed(0) + 'ms';
      maxTotal = Math.max(maxTotal, delayMs + 800);
      const { tx, ty, rot } = transformFor(item, t);
      item.el.style.transform = 'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
      item.el.style.opacity = (1 - t * 0.3).toFixed(3);
    }
    currentT = t;
    tagline.style.transition = 'opacity 900ms ease';
    tagline.style.opacity = clamp((t - 0.35) / 0.4, 0, 1).toFixed(3);

    clearTimeout(bounceTimer);
    if (!toShattered){
      bounceTimer = setTimeout(function(){
        wrapEl.classList.add('bounce');
        setTimeout(function(){ wrapEl.classList.remove('bounce'); }, 380);
      }, maxTotal);
    }
  }

  function toggleClick(){
    if (currentMode !== 'click') return;
    setClickState(assembled);
  }

  /* ---- breathe mode: pure CSS keyframes, just clear inline state ---- */
  function clearInlineStyles(){
    for (const item of items){
      item.el.style.transform = '';
      item.el.style.opacity = '';
      item.el.style.transitionDelay = '';
      item.el.style.animationDelay = (item.delay * 0.3).toFixed(0) + 'ms';
    }
  }

  const HINTS = {
    scroll: 'Scroll to shatter — scroll back up to reform',
    click: 'Click anywhere on the glass',
    breathe: 'Watching quietly'
  };

  function setMode(mode){
    if (mode === currentMode) return;
    currentMode = mode;
    cancelLoop();
    clearTimeout(bounceTimer);
    wrapEl.classList.remove('bounce');

    document.querySelectorAll('.mode-btn').forEach(function(b){
      const active = b.dataset.mode === mode;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    document.body.dataset.mode = mode;
    hintEl.textContent = HINTS[mode] || '';

    if (mode === 'scroll'){
      for (const item of items){ item.el.style.transitionDelay = ''; item.el.style.animationDelay = ''; }
      window.scrollTo(0, 0);
      currentT = 0;
      applyUniform(0);
      rafId = requestAnimationFrame(scrollLoop);
    } else if (mode === 'click'){
      assembled = true;
      for (const item of items){ item.el.style.transitionDelay = ''; item.el.style.animationDelay = ''; }
      currentT = 0;
      applyUniform(0);
      tagline.style.transition = 'none';
      tagline.style.opacity = '0';
    } else if (mode === 'breathe'){
      clearInlineStyles();
      tagline.style.opacity = '0';
    }
  }

  function readMultAndReapply(){
    mult = readMultipliers();
    if (currentMode === 'click'){
      setClickState(!assembled);
    } else {
      applyUniform(currentT);
    }
  }
  window.addEventListener('resize', readMultAndReapply);

  document.querySelectorAll('.mode-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setMode(btn.dataset.mode); });
  });

  wrapEl.addEventListener('click', toggleClick);
  wrapEl.setAttribute('tabindex', '0');
  wrapEl.setAttribute('role', 'button');
  wrapEl.setAttribute('aria-label', 'Toggle glass shatter');
  wrapEl.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && currentMode === 'click'){
      e.preventDefault();
      toggleClick();
    }
  });

  setMode('scroll');
})();
</script>
</body>
</html>
